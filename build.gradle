plugins {
	id 'net.fabricmc.fabric-loom' version "1.19-SNAPSHOT"
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.max_minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.fabricmc.net" }
    maven { url "https://libraries.minecraft.net" }
	maven { url "https://maven.shedaniel.me/" } // For Cloth Config
	maven { url "https://maven.terraformersmc.com/" } // For ModMenu
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"enchantments-unbound" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

sourceSets {
	main {
		resources {
			srcDirs = ["src/main/resources"]
		}
	}

	client {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.max_minecraft_version}"
	//mappings loom.officialMojangMappings()
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	
}

processResources {
	def map = [
			"version": project.mod_version,
			"min_minecraft_version": project.min_minecraft_version,
			"max_minecraft_version": project.max_minecraft_version,
			"loader_version": project.loader_version
	]
	inputs.properties map

	filesMatching("fabric.mod.json") {
		expand map
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	// withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}